<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360">
  <style>
    .bond { stroke: #333; stroke-width: 3; stroke-linecap: round; }
    .atom-text { font-family: Arial, Helvetica, sans-serif; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    .c-text { font-size: 22px; fill: #222; }
    .o-text { font-size: 22px; fill: #d32f2f; }
    .h-text { font-size: 16px; fill: #555; }
  </style>

  <!-- ===== Связи ===== -->

  <!-- CH3 — карбонильный C -->
  <line x1="140" y1="200" x2="230" y2="180" class="bond"/>

  <!-- Карбонильный C = O (двойная связь) -->
  <line x1="230" y1="180" x2="320" y2="120" class="bond"/>
  <line x1="236" y1="189" x2="326" y2="129" class="bond"/>

  <!-- Карбонильный C — альдегидный H -->
  <line x1="230" y1="180" x2="230" y2="90" class="bond"/>

  <!-- CH3: три связи C–H -->
  <line x1="140" y1="200" x2="80" y2="140" class="bond"/>   <!-- H вверх-влево -->
  <line x1="140" y1="200" x2="60" y2="220" class="bond"/>   <!-- H влево -->
  <line x1="140" y1="200" x2="90" y2="280" class="bond"/>   <!-- H вниз-влево -->

  <!-- ===== Атомы ===== -->

  <!-- CH3: углерод -->
  <circle cx="140" cy="200" r="16" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="140" y="200" class="atom-text c-text">C</text>

  <!-- CH3: водороды (каждый отдельно) -->
  <circle cx="80" cy="140" r="12" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="80" y="140" class="atom-text h-text">H</text>

  <circle cx="60" cy="220" r="12" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="60" y="220" class="atom-text h-text">H</text>

  <circle cx="90" cy="280" r="12" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="90" y="280" class="atom-text h-text">H</text>

  <!-- Карбонильный углерод -->
  <circle cx="230" cy="180" r="16" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="230" y="180" class="atom-text c-text">C</text>

  <!-- Кислород (карбонил) -->
  <circle cx="320" cy="120" r="16" fill="#f5f5f5" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="320" y="120" class="atom-text o-text">O</text>

  <!-- Альдегидный водород (отдельно) -->
  <circle cx="230" cy="90" r="12" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="230" y="90" class="atom-text h-text">H</text>

  <!-- ===== Подпись ===== -->
  <text x="230" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#666">
    Ацетальдегид (этаналь), CH₃COH
  </text>
</svg>